name: Test Docker image

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: pulldocker
        run: |
          docker pull ghcr.io/mydocker-repo/node-puppeteer:custom-25.11.25
          docker images
          docker run -d --name puppeteer ghcr.io/mydocker-repo/node-puppeteer:custom-25.11.25 sh -c "node /app/index.js"
          
